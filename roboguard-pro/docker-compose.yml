version: '3.8'

services:
  # ==================== DATABASES ====================
  mongodb:
    image: mongo:7
    container_name: roboguard-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: roboguard2024
      MONGO_INITDB_DATABASE: roboguard
    volumes:
      - mongodb_data:/data/db
      - ./database/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    networks:
      - roboguard-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: roboguard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - roboguard-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==================== BACKEND API (Node.js + JS Framework) ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roboguard-backend
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      MONGODB_URI: mongodb://admin:roboguard2024@mongodb:27017/roboguard?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: roboguard-secret-key-change-in-production
      FRONTEND_URL: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - roboguard-network
    restart: unless-stopped

  # ==================== AI ENGINE (Python Framework) ====================
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: roboguard-ai-engine
    ports:
      - "8001:8001"
    environment:
      PYTHONUNBUFFERED: 1
      MONGODB_URI: mongodb://admin:roboguard2024@mongodb:27017/roboguard?authSource=admin
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MODEL_PATH: /models
    volumes:
      - ./ai-engine/models:/models
    depends_on:
      - mongodb
      - redis
    networks:
      - roboguard-network
    restart: unless-stopped

  # ==================== CORE SERVICES (Rust Framework) ====================
  core-services:
    build:
      context: ./core-services
      dockerfile: Dockerfile
    container_name: roboguard-core-services
    ports:
      - "8080:8080"
    environment:
      RUST_LOG: info
      DATABASE_URL: mongodb://admin:roboguard2024@mongodb:27017/roboguard?authSource=admin
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - redis
    networks:
      - roboguard-network
    restart: unless-stopped

  # ==================== FLEET SERVICES (Go Framework) ====================
  fleet-services:
    build:
      context: ./fleet-services
      dockerfile: Dockerfile
    container_name: roboguard-fleet-services
    ports:
      - "8090:8090"
    environment:
      GO_ENV: production
      MONGODB_URI: mongodb://admin:roboguard2024@mongodb:27017/roboguard?authSource=admin
      REDIS_URL: redis://redis:6379
      MAX_ROBOTS: 100
    depends_on:
      - mongodb
      - redis
    networks:
      - roboguard-network
    restart: unless-stopped

  # ==================== FRONTEND (React/Next.js) ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roboguard-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_PUBLIC_AI_ENGINE_URL: http://localhost:8001
    depends_on:
      - backend
    networks:
      - roboguard-network
    restart: unless-stopped

  # ==================== NGINX (API Gateway) ====================
  nginx:
    image: nginx:alpine
    container_name: roboguard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
      - ai-engine
      - core-services
      - fleet-services
    networks:
      - roboguard-network
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  roboguard-network:
    driver: bridge
