version: '3.8'

services:
  # Neural Core - Rust-based decision engine
  neural-core:
    build:
      context: ./services/neural-core
      dockerfile: Dockerfile
    container_name: robotics-neural-core
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://postgres:robotics2024@database:5432/robotics_brain
      - REDIS_URL=redis://redis:6379
      - AUTONOMOUS_MODE=true
      - EVOLUTION_ENABLED=true
    ports:
      - "8080:8080"
    depends_on:
      - database
      - redis
    networks:
      - robotics-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # AI Engine - Python-based content generation & optimization
  ai-engine:
    build:
      context: ./services/ai-engine
      dockerfile: Dockerfile
    container_name: robotics-ai-engine
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=postgresql://postgres:robotics2024@database:5432/robotics_brain
      - REDIS_URL=redis://redis:6379
      - CONTENT_GENERATION_RATE=10
      - OPTIMIZATION_LEVEL=maximum
    ports:
      - "8001:8001"
    depends_on:
      - database
      - redis
      - neural-core
    networks:
      - robotics-network
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # Frontend - Next.js/React application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: robotics-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://api-gateway:3000
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - robotics-network
    restart: unless-stopped

  # API Gateway - Nginx reverse proxy
  api-gateway:
    image: nginx:alpine
    container_name: robotics-api-gateway
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - neural-core
      - ai-engine
      - frontend
    networks:
      - robotics-network
    restart: unless-stopped

  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: robotics-database
    environment:
      - POSTGRES_DB=robotics_brain
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=robotics2024
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - robotics-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    container_name: robotics-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - robotics-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Elasticsearch - Knowledge Graph & Search
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: robotics-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - robotics-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  # Prometheus - Monitoring & Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: robotics-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - robotics-network
    restart: unless-stopped

  # Grafana - Visualization Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: robotics-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=robotics2024
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - prometheus
    networks:
      - robotics-network
    restart: unless-stopped

  # Analytics Service - User behavior tracking
  analytics:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    container_name: robotics-analytics
    environment:
      - DATABASE_URL=postgresql://postgres:robotics2024@database:5432/robotics_brain
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    ports:
      - "8002:8002"
    depends_on:
      - database
      - redis
      - elasticsearch
    networks:
      - robotics-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  elastic_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  robotics-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
