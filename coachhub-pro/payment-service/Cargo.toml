[package]
name = "coachhub-payment-service"
version = "1.0.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-rt = "2.9"
actix-cors = "0.7"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redis = { version = "0.24", features = ["tokio-comp"] }
env_logger = "0.11"
log = "0.4"
anyhow = "1.0"
reqwest = { version = "0.11", features = ["json"] }
dotenv = "0.15"

# Autonomous framework (local path)
autonomous-robotics = { path = "../../../frameworks/rust" }
