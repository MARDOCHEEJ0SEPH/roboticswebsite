[package]
name = "autonomous-robotics-framework"
version = "1.0.0"
edition = "2021"
authors = ["Autonomous Robotics Team <team@roboticswebsite.com>"]
description = "Autonomous Neural Framework for Rust - Self-evolving robotics website"
license = "MIT"
repository = "https://github.com/autonomous-robotics/neural-framework-rust"
keywords = ["autonomous", "ai", "neural-network", "self-evolving", "robotics"]
categories = ["web-programming", "science", "algorithms"]

[lib]
name = "autonomous_robotics"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "json", "chrono", "uuid"] }

# Redis
redis = { version = "0.24", features = ["tokio-comp", "json"] }

# ML/AI
ndarray = "0.15"
rand = "0.8"

# Concurrency
futures = "0.3"
dashmap = "5.5"

# Metrics
prometheus = "0.13"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "evolution_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[features]
default = ["full"]
full = ["ml", "distributed"]
ml = []
distributed = []
